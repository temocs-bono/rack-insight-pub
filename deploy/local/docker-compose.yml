# Rack Insight — LOCAL DEVELOPMENT ONLY.
#
# Fast local inner-loop for backend/frontend work. This is NOT the deployment
# mechanism — the testbed/production run on Kubernetes + ArgoCD
# (see ../kubernetes/ and ../../docs/deployment.md).
#
# Run from this directory (deploy/local):
#   docker compose up -d                                          # run (pre-built images)
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build   # build images
#
# Images are pre-built (no build:), so `up` works offline once images are loaded
# via `docker load` (see ../offline/).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rackinsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rackinsight}
      POSTGRES_DB: ${POSTGRES_DB:-rackinsight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rackinsight}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-rack-insight}-backend:${IMAGE_TAG:-1.4.0}
    # Applies Alembic migrations automatically on startup (upgrade head),
    # so the schema is always in sync with the running code version.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rackinsight}:${POSTGRES_PASSWORD:-rackinsight}@postgres:5432/${POSTGRES_DB:-rackinsight}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0RPYS0nOu5f5xkbXi3wYlLYasNci4RMOtayEqUKmyNI=}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Config-based plugin registration (air-gap / ConfigMap friendly). The
      # Core reaches plugins by service DNS, never localhost. Editing this JSON
      # (or overriding PLUGINS_CONFIG) is all it takes to register a plugin.
      PLUGINS_CONFIG_FILE: ${PLUGINS_CONFIG_FILE:-/config/plugins.json}
    volumes:
      - ./plugins.json:/config/plugins.json:ro
    # NB: the backend intentionally does NOT depend on any plugin — the Core
    # starts and stays healthy whether or not a plugin is up (failure isolation).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Example plugin — an independent service the Core registers and proxies to.
  # Reachable by the Core at the service DNS name http://example-plugin:8080.
  example-plugin:
    image: ${IMAGE_PREFIX:-rack-insight}-plugin-example:${IMAGE_TAG:-1.4.0}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-rack-insight}-frontend:${IMAGE_TAG:-1.4.0}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
