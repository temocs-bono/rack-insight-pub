# EXAMPLE ONLY — DO NOT COMMIT REAL SECRETS.
#
# Copy this file to a location OUTSIDE git (or generate it in your GitOps
# pipeline / sealed-secrets / external secret manager) and apply it, or replace
# the values below and apply with:
#     kubectl apply -n rack-insight -f secret.yaml
#
# Generate strong values:
#   JWT_SECRET_KEY : openssl rand -hex 32
#   ENCRYPTION_KEY : python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#
# The demo values here are the same non-secret defaults the app ships with so a
# fresh testbed comes up; CHANGE THEM for anything beyond a throwaway cluster.
apiVersion: v1
kind: Secret
metadata:
  name: rack-insight-secrets
  namespace: rack-insight
  labels:
    app.kubernetes.io/part-of: rack-insight
type: Opaque
stringData:
  # Backend
  JWT_SECRET_KEY: "change-me-in-production"
  ENCRYPTION_KEY: "0RPYS0nOu5f5xkbXi3wYlLYasNci4RMOtayEqUKmyNI="
  DEFAULT_ADMIN_PASSWORD: "admin123!"
  # Connection string used by the backend (embeds the DB password).
  DATABASE_URL: "postgresql+asyncpg://rackinsight:rackinsight@postgres:5432/rackinsight"
  # Password used by the postgres StatefulSet (must match the one in DATABASE_URL).
  POSTGRES_PASSWORD: "rackinsight"
