# Non-sensitive backend configuration. Every key maps 1:1 to an environment
# variable read by backend/config/settings.py. Sensitive values (JWT key,
# encryption key, DB password, admin password) live in the Secret instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rack-insight-config
  labels:
    app.kubernetes.io/part-of: rack-insight
data:
  DEBUG: "false"
  REDIS_URL: "redis://redis:6379/0"
  CACHE_TTL_SECONDS: "600"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  DEFAULT_ADMIN_USERNAME: "admin"
  COLLECTOR_TIMEOUT_SECONDS: "10"
  COLLECTOR_RETRY_COUNT: "3"
  SCHEDULER_ENABLED: "true"
  SCHEDULER_INTERVAL_SECONDS: "1800"
  # The browser reaches / and /api on the same Ingress origin, so CORS is not
  # strictly required; set this to the Ingress host if you call the API cross-origin.
  CORS_ORIGINS: "http://rack-insight.testbed.local"
  # Plugins are registered from a file mounted from the plugins ConfigMap.
  PLUGINS_CONFIG_FILE: "/config/plugins.json"
  PLUGIN_HEALTH_ENABLED: "true"
  PLUGIN_HEALTH_INTERVAL_SECONDS: "60"
  # Postgres init values (used by the postgres StatefulSet). The password is in
  # the Secret; the assembled DATABASE_URL (with password) is also in the Secret.
  POSTGRES_USER: "rackinsight"
  POSTGRES_DB: "rackinsight"
